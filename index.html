<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sprout.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#edf6fe" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Auto theme before first paint; the saved preference is applied once IndexedDB loads.
      (function () {
        var d = new Date();
        var m = d.getHours() * 60 + d.getMinutes();
        if (m < 390 || m >= 1110) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f2140');
        }
      })();
    </script>
    <meta name="description" content="A local-first daily check-in that nudges you outside." />
    <title>Sproutpatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
